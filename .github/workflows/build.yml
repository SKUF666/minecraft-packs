# Сборка Portalis.exe на GitHub: из исходника src/PackSwitcher.pyw, тем же скриптом, что и локально.
# Подпись: после одобрения заявки SignPath Foundation сюда добавляется шаг
# signpath/github-action-submit-signing-request (секрет SIGNPATH_API_TOKEN, organization-id, project-slug).
name: Build Portalis
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Build Portalis.exe
        run: python tools/build_exe.py --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Portalis
          path: dist/Portalis.exe
          if-no-files-found: error
